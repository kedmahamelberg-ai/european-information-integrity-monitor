name: Government full-source audit
on:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: ["Daily government communications"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum new or changed government records to audit (1-30)
        required: false
        default: "15"
        type: string
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AUDIT_LIMIT: ${{ inputs.limit || '15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require audit model key
        run: test -n "$OPENAI_API_KEY" || { echo '::error::OPENAI_API_KEY is required'; exit 1; }
      - name: Install bounded official-PDF reader
        run: python -m pip install '.[government]'
      - name: Restore audit checkpoint
        uses: actions/cache/restore@v4
        with:
          path: data/government_source_audit.json
          key: government-source-audit-v1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            government-source-audit-v1-${{ github.ref_name }}-
      - name: Plan exact source access
        id: source_plan
        run: python scripts/audit_government_sources.py --limit "$AUDIT_LIMIT" --plan
      - name: Connect the Malta archive route when needed
        id: malta_warp
        if: steps.source_plan.outputs.needs_malta == 'true' && vars.MALTA_WARP_TERMS_APPROVED == 'true'
        continue-on-error: true
        env:
          MALTA_WARP_TERMS_APPROVED: ${{ vars.MALTA_WARP_TERMS_APPROVED }}
        run: bash scripts/setup_malta_warp.sh
      - name: Compare exact official sources and saved labels
        run: python scripts/audit_government_sources.py --limit "$AUDIT_LIMIT"
      - name: Disconnect the Malta archive route
        if: always() && steps.malta_warp.outcome == 'success'
        run: sudo warp-cli --accept-tos disconnect
      - name: Save audit checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/government_source_audit.json
          key: government-source-audit-v1-${{ github.ref_name }}-${{ github.run_id }}
      - name: Upload item IDs, source evidence and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: government-source-audit
          path: |
            government-source-audit-report.json
            data/government_source_audit.json
          retention-days: 90
      - name: Publish open candidate findings
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_government_audit_findings.py

