name: Test and publish monitor
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 */2 * * *"
  workflow_run:
    workflows:
      [
        "Sunday research collection",
        "Refresh comments under corrected minimum",
        "Classify saved Monitor evidence",
      ]
    types: [completed]
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    # A reviewed saved-artifact recovery owns publication for that commit.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[saved-pages-recovery]'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install edition graphics dependency
        run: python -m pip install '.[publish]'
      - name: Restore permanent Field Wire editions
        uses: actions/checkout@v4
        with:
          ref: field-wire-editions
          path: build-cache
          sparse-checkout: editions
      - name: Test research invariants
        if: github.event_name != 'schedule'
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript
        if: github.event_name != 'schedule'
        run: |
          node --check apps/dashboard/app.js
          node --check apps/dashboard/live.js
          node --check apps/dashboard/map-data.js
          node --test tests/*.test.cjs
      - name: Select publication source
        id: publication-source
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os, subprocess
          allowed = {
              '.github/workflows/site.yml',
              'data/government_corrections.json',
              'data/government_full_sources.json',
              '.github/workflows/government-news.yml',
              '.github/workflows/government-source-audit.yml',
              'pyproject.toml',
              'apps/dashboard/app.js',
              'ops/government-source-audit-clock.sql',
              'ops/check-government-source-audit-clock.sql',
              'ops/government-source-audit-clock.md',
              'scripts/build_site.py',
              'scripts/collect_government_news.py',
              'scripts/government_reviews.py',
              'scripts/government_source_identities.py',
              'scripts/government_coverage.py',
              'scripts/verify_government_source_coverage.py',
              'scripts/continue_government_backlog.py',
              'scripts/setup_malta_warp.sh',
              'config/government_source_identities.json',
              'data/government_ai_backfill_priority.json',
              'tests/test_malta_collector.py',
              'tests/test_government_source_identities.py',
              'tests/test_government_coverage.py',
              'tests/test_government_backlog.py',
              'tests/test_austria_collector.py',
              'tests/test_government_reviews.py',
              'scripts/audit_government_sources.py',
              'tests/test_government_source_audit.py',
              'tests/test_canada_china_collectors.py',
              'tests/test_hungary_collector.py',
              'tests/test_government_transport_url.py',
              'tests/test_government_recovery.py',
          }
          try:
              changed = set(subprocess.check_output(
                  ['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True
              ).splitlines())
          except subprocess.CalledProcessError:
              changed = set()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"government_only={'true' if changed and changed <= allowed else 'false'}\n")
          PY
      - name: Build public export
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/build_site.py --camera-only
          elif [ "${{ steps.publication-source.outputs.government_only }}" = "true" ]; then
            python scripts/build_site.py --government-only
          elif [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ]; then
            python scripts/build_site.py --live
          else
            python scripts/build_site.py
          fi
      - name: Save permanent Field Wire editions
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/save_field_wire_edition.py build-cache
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - name: Deploy
        id: deployment
        uses: ./.github/actions/deploy-monitor-pages
