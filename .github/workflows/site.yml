name: Test and publish monitor
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  workflow_run:
    workflows:
      [
        "Sunday research collection",
        "Refresh comments under corrected minimum",
        "Transcript-based conflict classification",
      ]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test research invariants
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript
        run: |
          node --check apps/dashboard/app.js
          node --check apps/dashboard/live.js
          node --check apps/dashboard/map-data.js
          node --test tests/*.test.cjs
      - name: Build public export
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ]; then
            python scripts/build_site.py --live
          else
            python scripts/build_site.py
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
