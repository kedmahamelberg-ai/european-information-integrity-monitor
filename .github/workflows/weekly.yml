name: Sunday research collection
on:
  schedule:
    - cron: "17 5 * * 0"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: eiim-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
      EIIM_CAPTION_MONTHLY_REQUEST_LIMIT: ${{ vars.EIIM_CAPTION_MONTHLY_REQUEST_LIMIT || '100' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EIIM_ENABLE_LIVE: ${{ vars.EIIM_ENABLE_LIVE }}
      EIIM_ENABLE_AUDIO_TRANSCRIPTION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify live configuration
        run: |
          test "$EIIM_ENABLE_LIVE" = "true" || { echo '::error::EIIM_ENABLE_LIVE must be true for scheduled collection'; exit 1; }
          PYTHONPATH=src python -m eiim.cli preflight > /tmp/eiim-preflight.json
          python -c 'import json,sys; x=json.load(open("/tmp/eiim-preflight.json")); print(x); sys.exit(0 if x["ready"] else 1)'
      - name: Install collection dependencies
        run: pip install '.[live,audio]'
      - name: Collect and classify completed Amsterdam week
        shell: bash
        run: PYTHONPATH=src python -m eiim.hybrid --collect | tee run-report.json
      - name: Publish non-sensitive run report
        if: always()
        run: |
          if [ -f run-report.json ]; then
            echo '## Monitor collection report' >> "$GITHUB_STEP_SUMMARY"
            cat run-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
