name: Verify weekly research publication
on:
  schedule:
    - cron: "45 22 * * 0"
      timezone: "Europe/Amsterdam"
    - cron: "15 21 * * 1"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check completed weekly sample and coded results
        run: python scripts/check_research_health.py
