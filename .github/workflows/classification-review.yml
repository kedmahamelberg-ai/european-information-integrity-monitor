name: Transcript-based conflict classification
on:
  workflow_dispatch:
    inputs:
      batch:
        description: Retained batch ID (blank resumes all retained batches)
        required: false
        type: string
      classification_only:
        description: Classify saved text only (skip blocked caption and audio retrieval)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: eiim-research
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
      EIIM_CAPTION_MONTHLY_REQUEST_LIMIT: ${{ vars.EIIM_CAPTION_MONTHLY_REQUEST_LIMIT || '100' }}
      EIIM_ENABLE_LIVE: ${{ vars.EIIM_ENABLE_LIVE }}
      EIIM_ENABLE_AUDIO_TRANSCRIPTION: "true"
      REVIEW_BATCH: ${{ inputs.batch }}
      REVIEW_CLASSIFICATION_ONLY: ${{ inputs.classification_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify live configuration
        run: |
          test "$EIIM_ENABLE_LIVE" = "true" || { echo '::error::Live research is disabled'; exit 1; }
          for name in SUPABASE_URL SUPABASE_SECRET_KEY OPENAI_API_KEY YOUTUBE_API_KEY; do
            test -n "${!name}" || { echo "::error::Missing $name"; exit 1; }
          done
      - name: Test evidence and review invariants
        run: PYTHONPATH=src python -m unittest discover -s tests -q
      - name: Install public caption and CPU audio readers
        run: pip install '.[audio]'
      - name: Set private session path on runner
        run: echo "EIIM_YOUTUBE_COOKIE_FILE=$RUNNER_TEMP/eiim-youtube-cookies.txt" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare private YouTube session
        if: inputs.classification_only != true
        env:
          EIIM_YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES_TXT }}
        run: PYTHONPATH=src python -m eiim.youtube_session
      - name: Reclassify retained sources with English transcripts
        shell: bash
        run: |
          recovery=()
          if [ "$REVIEW_CLASSIFICATION_ONLY" != "true" ]; then
            recovery+=(--retrieve-captions)
          fi
          if [ -n "$REVIEW_BATCH" ]; then
            PYTHONPATH=src python -m eiim.hybrid "${recovery[@]}" --batch "$REVIEW_BATCH" | tee /tmp/hybrid-report.json
          else
            PYTHONPATH=src python -m eiim.hybrid --all-retained "${recovery[@]}" | tee /tmp/hybrid-report.json
          fi
      - name: Remove private YouTube session
        if: always()
        run: PYTHONPATH=src python -m eiim.youtube_session cleanup
      - name: Publish run summary even after a partial run
        if: always()
        run: |
          if [ -f /tmp/hybrid-report.json ]; then
            tail -80 /tmp/hybrid-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
