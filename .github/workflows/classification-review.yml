name: Transcript-based conflict classification
on:
  workflow_dispatch:
    inputs:
      batch:
        description: Retained batch ID (blank selects latest)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: eiim-research
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      REVIEW_BATCH: ${{ inputs.batch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test evidence and review invariants
        run: PYTHONPATH=src python -m unittest discover -s tests -q
      - name: Install public caption reader
        run: pip install youtube-transcript-api==1.2.4
      - name: Reclassify retained sources with English transcripts
        run: |
          if [ -n "$REVIEW_BATCH" ]; then
            PYTHONPATH=src python -m eiim.hybrid --refresh-engagement --batch "$REVIEW_BATCH" > /tmp/hybrid-report.json
          else
            PYTHONPATH=src python -m eiim.hybrid --refresh-engagement > /tmp/hybrid-report.json
          fi
          tail -40 /tmp/hybrid-report.json >> "$GITHUB_STEP_SUMMARY"
