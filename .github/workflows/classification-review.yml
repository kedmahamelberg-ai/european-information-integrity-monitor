name: Evidence-based classification review
on:
  workflow_dispatch:
    inputs:
      batch:
        description: Retained batch ID (blank selects latest)
        required: false
        type: string
  workflow_run:
    workflows: ["Sunday research collection"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: eiim-research
  cancel-in-progress: false
jobs:
  classify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REVIEW_BATCH: ${{ inputs.batch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test evidence and review invariants
        run: PYTHONPATH=src python -m unittest discover -s tests -q
      - name: Install public caption reader
        run: pip install youtube-transcript-api==1.2.4
      - name: Check live model against synthetic boundary cases
        run: |
          if [ -n "$REVIEW_BATCH" ]; then
            PYTHONPATH=src python -m eiim.cli classify-review --evaluate-only --batch "$REVIEW_BATCH"
          else
            PYTHONPATH=src python -m eiim.cli classify-review --evaluate-only
          fi
      - name: Reclassify retained eligible sources within the existing weekly budget
        run: |
          if [ -n "$REVIEW_BATCH" ]; then
            PYTHONPATH=src python -m eiim.cli classify-review --retrieve-captions --batch "$REVIEW_BATCH" > /tmp/reclassification-report.json
          else
            PYTHONPATH=src python -m eiim.cli classify-review --retrieve-captions > /tmp/reclassification-report.json
          fi
          cat /tmp/reclassification-report.json >> "$GITHUB_STEP_SUMMARY"
