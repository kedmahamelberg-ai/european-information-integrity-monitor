name: Daily government communications
on:
  # Supabase pg_cron dispatches the early pass and 15:00 full pass in Amsterdam.
  # See ops/government-daily-clock.md; no duplicate GitHub cron triggers.
  workflow_dispatch:
    inputs:
      daily_phase:
        description: Scheduler phase (early or retry for the 15:00 full pass); leave blank for a manual run
        required: false
        type: string
      since:
        description: Start date for bounded backfill (YYYY-MM-DD)
        required: false
        type: string
      until:
        description: Inclusive end date for bounded backfill (YYYY-MM-DD)
        required: false
        type: string
      countries:
        description: Comma-separated ISO codes for an isolated pilot (for example NL,AT)
        required: false
        type: string
      classify_only:
        description: Classify saved pending items without rediscovering source archives
        required: false
        default: false
        type: boolean
      discovery_only:
        description: Check official source archives without calling the classifier
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.schedule.outputs.enabled }}
      until: ${{ steps.schedule.outputs.until }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the daily Amsterdam collection time
        id: schedule
        run: python scripts/government_schedule.py prepare
  collect:
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    # Take the shared publishing lock only after the pre-15:00 wait.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DAILY_UNTIL: ${{ needs.prepare.outputs.until }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      COLLECTION_SINCE: ${{ inputs.since }}
      COLLECTION_UNTIL: ${{ inputs.until }}
      COLLECTION_COUNTRIES: ${{ inputs.countries }}
      CLASSIFY_ONLY: ${{ inputs.classify_only }}
      DISCOVERY_ONLY: ${{ inputs.discovery_only }}
      DAILY_PHASE: ${{ inputs.daily_phase }}
      MALTA_WARP_TERMS_APPROVED: ${{ vars.MALTA_WARP_TERMS_APPROVED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate classifier and Supabase configuration
        run: |
          test -n "$OPENAI_API_KEY" || { echo '::error::OPENAI_API_KEY is required'; exit 1; }
          test -n "$SUPABASE_URL" || { echo '::error::SUPABASE_URL is required'; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo '::error::SUPABASE_SECRET_KEY is required'; exit 1; }
      - name: Prepare isolated cache scope
        id: cache_scope
        run: |
          if [ -n "$COLLECTION_COUNTRIES" ]; then
            [[ "$COLLECTION_COUNTRIES" =~ ^[A-Z]{2}(,[A-Z]{2})*$ ]] || { echo '::error::countries must be comma-separated ISO codes'; exit 1; }
            echo "scope=${COLLECTION_COUNTRIES//,/-}" >> "$GITHUB_OUTPUT"
          else
            echo 'scope=all' >> "$GITHUB_OUTPUT"
          fi
      - name: Restore collection checkpoint
        uses: actions/cache/restore@v4
        with:
          path: data/government_state.json
          key: government-checkpoint-hybrid-v3-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            government-checkpoint-hybrid-v3-${{ github.ref_name }}-
            government-checkpoint-hybrid-v2-${{ github.ref_name }}-
      - name: Check saved daily progress
        id: daily
        run: python scripts/government_schedule.py collect
      - name: Check whether Malta needs its VPN route
        id: malta_route
        env:
          DAILY_MODE: ${{ steps.daily.outputs.mode }}
        run: |
          enabled=true
          if [[ "$DAILY_MODE" == "classify-only" || "$CLASSIFY_ONLY" == "true" ]]; then enabled=false; fi
          if [[ -n "$COLLECTION_COUNTRIES" && ",$COLLECTION_COUNTRIES," != *",MT,"* ]]; then enabled=false; fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - name: Connect a local WARP proxy for Malta
        id: malta_warp
        if: steps.malta_route.outputs.enabled == 'true' && vars.MALTA_WARP_TERMS_APPROVED == 'true'
        continue-on-error: true
        run: bash scripts/setup_malta_warp.sh
      - name: Warn if the Malta VPN route is unavailable
        if: steps.malta_route.outputs.enabled == 'true' && steps.malta_warp.outcome != 'success'
        run: echo '::warning::Malta VPN route is unavailable; the collector will attempt its normal route and record any source failure.'
      - name: Collect, translate and classify official government news
        env:
          DAILY_MODE: ${{ steps.daily.outputs.mode }}
        run: |
          args=()
          if [ -n "$DAILY_UNTIL" ]; then args+=(--until "$DAILY_UNTIL"); fi
          if [ "$DAILY_MODE" = "classify-only" ]; then args+=(--classify-only); fi
          if [ -n "$COLLECTION_SINCE" ]; then args+=(--since "$COLLECTION_SINCE"); fi
          if [ -n "$COLLECTION_UNTIL" ]; then args+=(--until "$COLLECTION_UNTIL"); fi
          if [ -n "$COLLECTION_COUNTRIES" ]; then args+=(--countries "$COLLECTION_COUNTRIES"); fi
          if [ "$CLASSIFY_ONLY" = "true" ]; then args+=(--classify-only); fi
          if [ "$DISCOVERY_ONLY" = "true" ]; then args+=(--discovery-only); fi
          python scripts/collect_government_news.py "${args[@]}"
      - name: Summarize source access
        if: always()
        run: python scripts/report_government_sources.py
      - name: Save collection checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/government_state.json
          key: government-checkpoint-hybrid-v3-${{ github.ref_name }}-${{ github.run_id }}
      - name: Build public dashboard
        run: python scripts/build_site.py --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: government-human-review-queue
          path: |
            build/government-review-queue.json
            build/government-data.json
            build/government-source-diagnostics.json
            data/government_state.json
          retention-days: 30
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build
      - name: Deploy updated monitor
        id: deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
