name: Daily government communications
on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      since:
        description: Start date for initial backfill (defaults to 2026-10-01 or the saved collection cursor)
        required: false
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COLLECTION_SINCE: ${{ inputs.since }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate classifier configuration
        run: test -n "$OPENAI_API_KEY" || { echo '::error::OPENAI_API_KEY is required'; exit 1; }
      - name: Collect, translate and classify official government news
        run: |
          if [ -n "$COLLECTION_SINCE" ]; then
            python scripts/collect_government_news.py --since "$COLLECTION_SINCE" || { git checkout -- data/government_state.json; exit 1; }
          else
            python scripts/collect_government_news.py || { git checkout -- data/government_state.json; exit 1; }
          fi
      - name: Build public dashboard
        run: python scripts/build_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: government-human-review-queue
          path: build/government-review-queue.json
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - name: Deploy updated monitor
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Save collection cursor and publish updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/government_state.json
          git commit -m "Update daily government communications" || true
          git push
