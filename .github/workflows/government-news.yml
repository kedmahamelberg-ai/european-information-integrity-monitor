name: Daily government communications
on:
  schedule:
    - cron: "0 15 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      since:
        description: Start date for bounded backfill (YYYY-MM-DD)
        required: false
        type: string
      until:
        description: Inclusive end date for bounded backfill (YYYY-MM-DD)
        required: false
        type: string
      countries:
        description: Comma-separated ISO codes for an isolated pilot (for example NL,AT)
        required: false
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      COLLECTION_SINCE: ${{ inputs.since }}
      COLLECTION_UNTIL: ${{ inputs.until }}
      COLLECTION_COUNTRIES: ${{ inputs.countries }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate classifier and Supabase configuration
        run: |
          test -n "$OPENAI_API_KEY" || { echo '::error::OPENAI_API_KEY is required'; exit 1; }
          test -n "$SUPABASE_URL" || { echo '::error::SUPABASE_URL is required'; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo '::error::SUPABASE_SECRET_KEY is required'; exit 1; }
      - name: Prepare isolated cache scope
        id: cache_scope
        run: |
          if [ -n "$COLLECTION_COUNTRIES" ]; then
            [[ "$COLLECTION_COUNTRIES" =~ ^[A-Z]{2}(,[A-Z]{2})*$ ]] || { echo '::error::countries must be comma-separated ISO codes'; exit 1; }
            echo "scope=${COLLECTION_COUNTRIES//,/-}" >> "$GITHUB_OUTPUT"
          else
            echo 'scope=all' >> "$GITHUB_OUTPUT"
          fi
      - name: Restore collection checkpoint
        uses: actions/cache/restore@v4
        with:
          path: data/government_state.json
          key: government-checkpoint-hybrid-v2-${{ github.ref_name }}-${{ steps.cache_scope.outputs.scope }}-${{ github.run_id }}
          restore-keys: government-checkpoint-hybrid-v2-${{ github.ref_name }}-${{ steps.cache_scope.outputs.scope }}-
      - name: Collect, translate and classify official government news
        run: |
          args=()
          if [ -n "$COLLECTION_SINCE" ]; then args+=(--since "$COLLECTION_SINCE"); fi
          if [ -n "$COLLECTION_UNTIL" ]; then args+=(--until "$COLLECTION_UNTIL"); fi
          if [ -n "$COLLECTION_COUNTRIES" ]; then args+=(--countries "$COLLECTION_COUNTRIES"); fi
          python scripts/collect_government_news.py "${args[@]}"
      - name: Save collection checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/government_state.json
          key: government-checkpoint-hybrid-v2-${{ github.ref_name }}-${{ steps.cache_scope.outputs.scope }}-${{ github.run_id }}
      - name: Build public dashboard
        run: python scripts/build_site.py --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: government-human-review-queue
          path: |
            build/government-review-queue.json
            build/government-data.json
            data/government_state.json
          retention-days: 30
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build
      - name: Deploy updated monitor
        id: deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
