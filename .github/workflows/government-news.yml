name: Daily government communications
on:
  # Scheduled runs resume after the source register and staged review workflow are approved.
  workflow_dispatch:
    inputs:
      since:
        description: Start date for bounded backfill (YYYY-MM-DD)
        required: false
        type: string
      until:
        description: Inclusive end date for bounded backfill (YYYY-MM-DD)
        required: false
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      COLLECTION_SINCE: ${{ inputs.since }}
      COLLECTION_UNTIL: ${{ inputs.until }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate classifier and Supabase configuration
        run: |
          test -n "$OPENAI_API_KEY" || { echo '::error::OPENAI_API_KEY is required'; exit 1; }
          test -n "$SUPABASE_URL" || { echo '::error::SUPABASE_URL is required'; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo '::error::SUPABASE_SECRET_KEY is required'; exit 1; }
      - name: Collect, translate and classify official government news
        run: |
          args=()
          if [ -n "$COLLECTION_SINCE" ]; then args+=(--since "$COLLECTION_SINCE"); fi
          if [ -n "$COLLECTION_UNTIL" ]; then args+=(--until "$COLLECTION_UNTIL"); fi
          python scripts/collect_government_news.py "${args[@]}"
      - name: Build public dashboard
        run: python scripts/build_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: government-human-review-queue
          path: build/government-review-queue.json
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - name: Deploy updated monitor
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Save collection cursor and publish updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/government_state.json
          git commit -m "Update daily government communications" || true
          git push
