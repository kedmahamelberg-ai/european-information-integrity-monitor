<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>European Monitor · weekly source scan</title><style>*{box-sizing:border-box}body{margin:0;background:#030607;color:#c8f78e;font:11px ui-monospace,monospace}header,footer{display:flex;justify-content:space-between;gap:12px;padding:12px 18px}header{letter-spacing:2px;border-bottom:1px solid #25322a}svg{width:100%;height:calc(100vh - 92px);min-height:210px;display:block}#land path{fill:#101717;stroke:#34453b;stroke-width:.7}.point{fill:#b9ee74;stroke:#b9ee74;fill-opacity:.35}.waiting{fill:#efb85b;stroke:#efb85b}#target{fill:none;stroke:#e4ffc3;stroke-width:1.5;transition:transform 1s ease-in-out}button{background:#142019;border:1px solid #40563b;color:inherit;padding:4px 10px;font:inherit;cursor:pointer}footer{color:#9baa9e;font-size:10px}#caption{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(prefers-reduced-motion:reduce){#target{transition:none}}</style><header><span>EUROPE / SOURCE SCAN</span><button id="pause">Pause</button></header><svg viewBox="0 0 960 650" role="img" aria-label="Europe map scanning country mentions in the retained weekly video sample"><defs><pattern id="grid" width="60" height="50" patternUnits="userSpaceOnUse"><path d="M60 0H0V50" fill="none" stroke="#17221e" stroke-width=".6"/></pattern></defs><rect width="960" height="650" fill="url(#grid)"/><g id="land"></g><g id="dots"></g><g id="target" visibility="hidden"><circle r="25"/><path d="M-36 0H-16M16 0H36M0-36V-16M0 16V36"/></g></svg><footer><span id="caption">Loading weekly sample…</span><span>ANIMATED DATA SCAN · NOT LIVE THREATS</span></footer><script src="radar.js"></script></html>
